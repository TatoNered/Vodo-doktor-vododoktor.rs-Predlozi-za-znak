<!doctype html>
<html lang="sr-Latn-RS">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Vodo doktor — predlozi za znak</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Dvanaest predloga za znak firme Vodo doktor. Svaki se može preuzeti kao SVG.">
<style>
  :root{
    --ink:#0F2436; --brand:#C8401A; --muted:#5B7286; --line:#DDE4EA;
    --bg:#F2F5F7; --card:#ffffff; --line-2:#EDF1F4;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* Strana je uvek svetla. Znaci su crtani u tamnoj boji, pa na tamnoj
     podlozi nestaju — zato se i tamna tema i automatsko zatamnjenje
     pregledača isključuju. */
  :root{color-scheme:light}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
       padding:40px 16px 56px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto}
  .kick{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
  h1{font-size:clamp(26px,5.5vw,40px);font-weight:800;letter-spacing:-0.6px;line-height:1.15;margin-bottom:34px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
     padding:28px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .n{position:absolute;top:12px;left:14px;width:26px;height:26px;border-radius:8px;background:var(--ink);
     color:var(--bg);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .mark{width:100px;height:100px;display:block}
  .t{font-size:15px;font-weight:700;text-align:center;line-height:1.3;min-height:40px;
     display:flex;align-items:center;justify-content:center}
  .bot{border-top:1px solid var(--line-2);padding-top:12px;width:100%;
       display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mini{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .dl{appearance:none;background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);
      font:inherit;font-size:13px;font-weight:600;padding:0 14px;min-height:44px;cursor:pointer}
  .dl:hover{border-color:var(--brand);color:var(--brand)}
  @media (max-width:430px){
    body{padding:28px 16px 44px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .c{padding:26px 10px 14px}
    .mark{width:76px;height:76px}
    .t{font-size:13.5px;min-height:36px}
    .bot{flex-direction:column;align-items:stretch;gap:8px}
    .dl{width:100%}
    .mini{justify-content:center}
  }
</style>
</head>

<script>
  // Preuzimanje znaka u vektoru. Sve se pravi iz onoga što je već na strani,
  // pa fajl radi i bez interneta i bez ijedne spoljne biblioteke.
  document.querySelectorAll(".dl").forEach(function (dugme) {
    dugme.addEventListener("click", function () {
      var kartica = dugme.closest(".c");
      var znak = kartica.querySelector(".mark");
      var kopija = znak.cloneNode(true);
      kopija.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      kopija.setAttribute("width", "512");
      kopija.setAttribute("height", "512");
      kopija.removeAttribute("class");
      kopija.removeAttribute("data-ime");
      var tekst = '<?xml version="1.0" encoding="UTF-8"?>\n' + kopija.outerHTML + "\n";
      var veza = document.createElement("a");
      veza.href = URL.createObjectURL(new Blob([tekst], { type: "image/svg+xml" }));
      veza.download = "vodo-doktor-" + znak.getAttribute("data-ime") + ".svg";
      document.body.appendChild(veza);
      veza.click();
      document.body.removeChild(veza);
      URL.revokeObjectURL(veza.href);
    });
  });
</script>

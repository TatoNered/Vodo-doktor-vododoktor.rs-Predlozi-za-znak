<head>
<meta charset="utf-8">

<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>Vodo doktor — predlozi za znak</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Predlozi za znak firme Vodo doktor. Svaki se može preuzeti kao SVG.">
<style>
  /* Strana je uvek svetla. Znaci su crtani tamnoplavo i na tamnoj podlozi
     nestaju, pa se tamna tema ne koristi. Pored toga, svaki znak je slika
     sa sopstvenom belom podlogom: pregledači koji sami zatamnjuju strane
     (Chrome na Androidu) ne diraju sadržaj slika, pa znak ostaje čitljiv
     i kada korisnik uključi tamni režim u telefonu. */
  :root{
    color-scheme: only light;
    --ink:#0F2436; --brand:#C8401A; --muted:#5B7286; --line:#DDE4EA;
    --bg:#F2F5F7; --card:#ffffff; --line-2:#EDF1F4;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{background:#F2F5F7}
  body{background:#F2F5F7;color:#0F2436;font-family:var(--font);line-height:1.5;
       padding:40px 16px 56px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto}
  .kick{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#C8401A;margin-bottom:8px}
  h1{font-size:clamp(26px,5.5vw,40px);font-weight:800;letter-spacing:-0.6px;line-height:1.15;margin-bottom:34px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .c{position:relative;background:#ffffff;border:1px solid #DDE4EA;border-radius:14px;
     padding:28px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .n{position:absolute;top:12px;left:14px;width:26px;height:26px;border-radius:8px;background:#0F2436;
     color:#F2F5F7;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .mark{width:100px;height:100px;display:block}
  .t{font-size:15px;font-weight:700;text-align:center;line-height:1.3;min-height:40px;
     display:flex;align-items:center;justify-content:center;color:#0F2436}
  .bot{border-top:1px solid #EDF1F4;padding-top:12px;width:100%;
       display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mini{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#5B7286}
  .dl{appearance:none;background:#ffffff;border:1px solid #DDE4EA;border-radius:7px;color:#5B7286;
      font:inherit;font-size:13px;font-weight:600;padding:0 14px;min-height:44px;cursor:pointer}
  .dl:hover{border-color:#C8401A;color:#C8401A}
  @media (max-width:430px){
    body{padding:28px 16px 44px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .c{padding:26px 10px 14px}
    .mark{width:76px;height:76px}
    .t{font-size:13.5px;min-height:36px}
    .bot{flex-direction:column;align-items:stretch;gap:8px}
    .dl{width:100%}
    .mini{justify-content:center}
  }
</style>
</head>
